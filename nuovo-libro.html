<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>Nuovo Libro</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
            <div class="container-fluid">
                <img src="./img/duck.png" alt="logo" class="logo">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Catalgo Libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica Utenti</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Storico Prestiti
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="true">Help</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                            data-bs-theme="light" />
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="container">
            
                <div class="row">
                    <div class="my-4"><h1>Nuovo Libro</h1></div>
                    <div class="col-6 d-flex flex-column pb-3">
                        <!-- nome autore -->
                        <label for="nome-autore" class="form-label">Nome autore</label>
                        <input type="text" id="nome-autore" placeholder="Inserisci il nome dell'autore" class="form-control">
                    </div>
                    <div class="col-6">
                        <!-- cognome autore -->
                         <label for="cognome-autore" class="form-label">Cognome autore</label>
                        <input type="text" id="cognome-autore" placeholder="Inserisci il cognome dell'autore" class="form-control">
                    </div>
                    <div class="col-12 pb-3">
                        <!-- titolo -->
                         <label for="titolo" class="form-label">Titolo</label>
                        <input type="text" id="titolo" placeholder="Inserisci il titolo" class="form-control">
                    </div>
                    <div class="col-12 col-lg-4 pb-3">
                        <!-- genere -->
                         <label for="genere" class="form-label">Genere</label>
                        <input type="text" id="genere" placeholder="Scegli il genere" class="form-control">
                    </div>
                    <div class="col-12 col-lg-4 pb-3">
                        <!-- anno di pubblicazione -->
                         <label for="anno-pubblicazione" class="form-label">Anno di pubblicazione</label>
                        <input type="date" id="anno-pubblicazione" placeholder="Inserisci l'anno" class="form-control">
                    </div>
                    <div class="col-12 col-lg-4 pb-3">
                        <!-- isbn -->
                         <label for="isbn" class="form-label">ISBN#</label>
                        <input type="number" id="isbn" placeholder="Inserisci ISBN#" class="form-control" min="13">
                    </div>
                </div>
                <div class="ds-top-border my-3"></div>
                <div>
                    <div class="col-12 pb-3">
                        <!-- note -->
                         <label for="note" class="form-label">Note</label> <br>
                         <input type="text" name="note" id="note" placeholder="Inserisci eventuiali note sul libro" class="form-control">
                    </div>
                    <div class="pb-3">
                        <input type="checkbox" id="disponibile-digitale">
                        <label for="disponibile-digitale">Disponibile anche in digitale</label>
                    </div>
                    <a href="" class="btn btn-primary align-items-center">Aggiungi Libro</a>
                </div>
            
        </section>
    </main>
</body>

</html>
